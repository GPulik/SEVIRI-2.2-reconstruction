[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "seviri22"
version = "1.0.0"
description = "Reconstruction of the 2.25 um reflectance channel for MSG SEVIRI from MTG FCI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

[tool.setuptools]
packages = ["seviri22"]
